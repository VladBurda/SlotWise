name: slotwise
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slotwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slotwise_local}
      POSTGRES_DB: ${POSTGRES_DB:-slotwise}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  migrate:
    build: ./backend
    command: [".venv/bin/alembic", "upgrade", "head"]
    environment: &backend_environment
      SLOTWISE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-slotwise}:${POSTGRES_PASSWORD:-slotwise_local}@postgres:5432/${POSTGRES_DB:-slotwise}
      SLOTWISE_REDIS_URL: redis://redis:6379/0
      SLOTWISE_ENVIRONMENT: development
      SLOTWISE_CORS_ORIGINS: '["http://localhost:5173"]'
      SLOTWISE_SMTP_HOST: mailpit
    depends_on:
      postgres: { condition: service_healthy }
  backend:
    build: ./backend
    environment:
      <<: *backend_environment
      SLOTWISE_MAIL_WORKER_ENABLED: 'true'
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 10s
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
  test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      <<: *backend_environment
      SLOTWISE_INTEGRATION: '1'
      SLOTWISE_MAIL_WORKER_ENABLED: 'false'
    depends_on:
      backend: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
